spring.datasource.url=jdbc:mysql://localhost:3306/microarc?useSSL=false
spring.datasource.username=root
spring.datasource.password=March@m299
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

resilience4j.circuitbreaker.instances.retryService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.retryService.slidingWindowSize= 5
resilience4j.circuitbreaker.instances.retryService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.retryService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.retryService.permittedNumberOfCallsInHalfOpenState= 3

# Spring Mail Config
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
